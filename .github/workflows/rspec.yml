name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        type: [coverage, features, helpers, mailer, models, rubocop]
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/infrastructure/tsp/containers/base:main

    steps:
    - uses: actions/checkout@v5

    - name: Cache ruby dependencies
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ruby-2.7-linux-${{ hashFiles('Gemfile.lock') }}

    - name: Install ruby dependencies
      run: |
        # The archived Ruby repository no longer publishes Leap 15.4 metadata.
        zypper modifyrepo --disable ruby
        zypper --non-interactive install nodejs libffi-devel libyaml-devel postgresql-devel postgresql-server-devel
        bundler.ruby2.7 config set path vendor/bundle
        bundler.ruby2.7 config set build.ffi --enable-system-libffi
        bundler.ruby2.7 config set build.nokogiri --use-system-libraries
        bundler.ruby2.7 config set build.sassc --disable-march-tune-native
        bundler.ruby2.7 config set build.nio4r --with-cflags=-Wno-return-type
        bundler.ruby2.7 install

    - name: Set up the environment
      run: |
        cp config/database.test.yml config/database.yml
        cp config/site.example.yml config/site.yml
        bundler.ruby2.7 exec rake db:migrate RAILS_ENV=test

    - if: ${{ matrix.type == 'rubocop' }}
      name: Run rubocop
      run: bundler.ruby2.7 exec rubocop

    - if: ${{ contains(fromJson('["features", "helpers", "mailer", "models"]'), matrix.type) }}
      name: Run spec
      run: bundler.ruby2.7 exec rspec spec/${{ matrix.type }}/

    - if: ${{ matrix.type == 'coverage' }}
      name: Run spec
      run: bundler.ruby2.7 exec rspec

    - if: ${{ matrix.type == 'coverage' }}
      name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
