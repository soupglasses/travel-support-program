name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: ruby:3.4.10-slim-bookworm
    env:
      RAILS_ENV: test
      DATABASE_URL: sqlite3:/dev/shm/tsp-test.sqlite3
      BUNDLE_PATH: vendor/bundle
      BUNDLE_BUILD__FFI: --enable-system-libffi
      BUNDLE_BUILD__NOKOGIRI: --use-system-libraries
      BUNDLE_BUILD__SASSC: --disable-march-tune-native
      BUNDLE_BUILD__NIO4R: --with-cflags=-Wno-return-type
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config git libpq-dev libsqlite3-dev default-libmysqlclient-dev libffi-dev libyaml-dev libxml2-dev libxslt1-dev chromium chromium-driver graphviz
          gem install bundler --version 2.6.9 --no-document
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache Ruby dependencies
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ruby-3.4.10-bookworm-${{ runner.arch }}-${{ hashFiles('Gemfile.lock') }}
      - name: Install Ruby dependencies
        run: bundle install --jobs=3 --retry=3
      - name: Set up the environment
        run: |
          cp config/database.test.yml config/database.yml
          cp config/site.example.yml config/site.yml
          bundle exec rake db:migrate
      - name: Run the full test suite
        run: bundle exec rspec
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Check production assets and eager loading
        env:
          RAILS_ENV: production
        run: bundle exec rake zeitwerk:check assets:precompile
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
